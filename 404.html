<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAP</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307070F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2300C4A8' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://gamma.app">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #F4F3F2; color: rgba(235,235,250,.9);
    font-family: "Space Grotesk", system-ui, sans-serif; }
  body.view { overflow: hidden; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* loading screen, in Gamma's page colour so it dissolves into the doc */
  #loader { position: fixed; inset: 0; z-index: 2; background: #F4F3F2; display: grid; place-items: center;
    transition: opacity .6s ease, visibility 0s linear .6s; }
  #loader.done { opacity: 0; visibility: hidden; }
  .ld { width: min(280px, 70vw); text-align: center; color: #1b1b22; }
  .ld-title { font-weight: 500; font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; animation: ldIn .8s ease .15s forwards; }
  .ld-bar { position: relative; height: 1px; margin-top: 18px; background: rgba(27,27,34,.1); overflow: hidden; }
  .ld-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%;
    background: linear-gradient(90deg, transparent, #1b1b22 50%, transparent);
    animation: ldSweep 1.5s cubic-bezier(.45,0,.25,1) infinite; }
  @keyframes ldIn { from { opacity: 0; transform: translateY(4px); } to { opacity: .78; transform: none; } }
  @keyframes ldSweep { from { transform: translateX(-100%); } to { transform: translateX(265%); } }
  @media (prefers-reduced-motion: reduce) {
    .ld-title { animation: none; opacity: .78; }
    .ld-bar::after { animation: ldPulse 1.6s ease-in-out infinite alternate; left: 0; width: 100%; }
    @keyframes ldPulse { from { opacity: .15; } to { opacity: .6; } }
  }
  .home { height: 100%; display: grid; place-items: center;
    background: radial-gradient(ellipse at 0% 0%, #12122a 0%, #07070F 60%); }
  .home h1 { font-weight: 600; font-size: 44px; letter-spacing: .02em; }
  .home h1 span { color: #00C4A8; }
</style>
</head>
<body>
<script>
  // Links look like /CAP/<name>/ . Names map to Gamma doc ids in links.json, which only
  // the repo owner can edit; anything not listed there shows the empty home page.
  const base = location.pathname.replace(/^(\/[^/]+\/).*$/, "$1");
  const key = decodeURIComponent(location.pathname.slice(base.length)).split("/").filter(Boolean)[0] || "";

  function home() {
    document.body.innerHTML = '<main class="home"><h1>CAP<span>.</span></h1></main>';
  }

  function loader(title) {
    let el = document.getElementById("loader");
    if (!el) {
      el = document.createElement("div");
      el.id = "loader";
      el.innerHTML = '<div class="ld"><div class="ld-title"></div><div class="ld-bar"></div></div>';
      document.body.appendChild(el);
    }
    el.querySelector(".ld-title").textContent = title || " ";
    return el;
  }

  function show(id, title) {
    document.body.className = "view";
    document.title = title || "‎";
    const ld = loader(title);
    const f = document.createElement("iframe");
    f.id = "frame";
    f.src = "https://gamma.app/embed/" + id;
    f.allow = "fullscreen";
    f.setAttribute("allowfullscreen", "");

    // Gamma sits behind Cloudflare. When a visitor gets a bot check, the check page
    // refuses to be framed ("gamma.app refused to connect"). A working embed posts
    // "[iFrameResizerChild]Ready" to us; if that never comes, open the doc on Gamma
    // itself, where the check can run.
    let ready = false, timer;
    const fallback = () => { if (!ready) location.replace(f.src); };
    addEventListener("message", e => {
      if (e.origin !== "https://gamma.app" || ready) return;
      ready = true; clearTimeout(timer);
      // give the first card a moment to paint before revealing
      setTimeout(() => ld.classList.add("done"), 500);
    });
    f.addEventListener("load", () => { clearTimeout(timer); timer = setTimeout(fallback, 4000); });
    timer = setTimeout(fallback, 20000);
    document.body.appendChild(f);
  }

  if (!key) home();
  else loader(), fetch(base + "links.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(links => {
      const k = key.toLowerCase();
      const name = Object.keys(links).find(n => n.toLowerCase() === k);
      if (name) return show(links[name], name.replace(/-/g, " "));
      // older id-style links keep working, but only for docs already in the list
      const byId = Object.keys(links).find(n => links[n] === k);
      byId ? show(k, byId.replace(/-/g, " ")) : home();
    })
    .catch(home);
</script>
</body>
</html>

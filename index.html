<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAP</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307070F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2300C4A8' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070F; --s1: #0B0B18; --s2: #0F0F20;
    --accent: #00C4A8; --t1: rgba(235,235,250,.92); --t2: rgba(220,220,240,.45);
    --rule: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--t1);
    font-family: "Space Grotesk", system-ui, sans-serif; }

  /* viewer */
  body.view { overflow: hidden; background: #fff; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* maker */
  .maker { min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse at 0% 0%, #12122a 0%, var(--bg) 60%); }
  .card { width: 100%; max-width: 560px; }
  h1 { font-weight: 600; font-size: 44px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--t2); margin: 8px 0 32px; font-size: 15px; line-height: 1.5; }
  label { display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--t2); margin: 18px 0 8px; }
  input { width: 100%; background: var(--s2); border: 1px solid var(--rule); border-radius: 10px;
    color: var(--t1); padding: 14px 16px; font: 14px "JetBrains Mono", ui-monospace, monospace; outline: none; }
  input:focus { border-color: var(--accent); }
  .out { margin-top: 28px; padding: 16px; background: var(--s1); border: 1px solid var(--rule);
    border-radius: 12px; display: none; }
  .out.show { display: block; }
  .link { font: 13px "JetBrains Mono", monospace; color: var(--accent); word-break: break-all; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button, .btn { flex: 1; min-width: 120px; background: var(--accent); color: #031512; border: 0;
    border-radius: 9px; padding: 11px 14px; font: 600 13px "Space Grotesk", sans-serif;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-align: center; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--t1); border: 1px solid var(--rule); }
  .err { color: #ff7a8a; font-size: 13px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<script>
  // Accepts a Gamma share link, embed link, iframe code, or a bare doc id.
  function parseGamma(text) {
    text = (text || "").trim();
    const src = text.match(/src=["']([^"']+)["']/i);
    const titleAttr = text.match(/title=["']([^"']+)["']/i);
    const url = src ? src[1] : text;
    let id = null, title = titleAttr ? titleAttr[1] : "";
    const m = url.match(/gamma\.app\/(?:embed|docs|public|present)\/([^/?#\s]+)/i);
    if (m) {
      const slug = decodeURIComponent(m[1]);
      const parts = slug.split("-");
      id = parts.pop();
      if (!title && parts.length) title = parts.join(" ");
    } else if (/^[a-z0-9]{8,}$/i.test(url)) {
      id = url;
    }
    return id ? { id: id.toLowerCase(), title } : null;
  }

  // Viewer links look like  /CAP/<id>  or  /CAP/<id>/<title-slug>  (served via 404.html),
  // with  /CAP/?<id>  and  /CAP/#<id>  as fallbacks.
  const base = location.pathname.replace(/^(\/[^/]+\/).*$/, "$1");
  const rest = decodeURIComponent(location.pathname.slice(base.length)).split("/").filter(Boolean);
  const id = rest[0] || location.search.slice(1) || location.hash.slice(1);
  const slug = rest[1] || "";

  if (id && /^[a-z0-9]+$/i.test(id)) {
    document.body.className = "view";
    document.title = slug ? slug.replace(/-/g, " ") : "‎";
    const f = document.createElement("iframe");
    f.id = "frame";
    f.src = "https://gamma.app/embed/" + id;
    f.allow = "fullscreen";
    f.setAttribute("allowfullscreen", "");
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = `
      <main class="maker"><div class="card">
        <h1>CAP<span>.</span></h1>
        <p class="sub">Paste a Gamma share link or embed code. Get back a clean link that opens the document fullscreen.</p>
        <label for="src">Gamma link or embed code</label>
        <input id="src" placeholder="https://gamma.app/docs/…" autocomplete="off" spellcheck="false">
        <label for="ttl">Tab title (optional)</label>
        <input id="ttl" placeholder="Week 3 — Re-interpretation" autocomplete="off">
        <div class="err" id="err"></div>
        <div class="out" id="out">
          <div class="link" id="link"></div>
          <div class="row">
            <button id="copy">Copy link</button>
            <a class="btn ghost" id="open" target="_blank" rel="noopener">Open</a>
          </div>
        </div>
      </div></main>`;
    const $ = s => document.getElementById(s);
    let lastAutoTitle = "";
    function update() {
      const raw = $("src").value;
      const g = parseGamma(raw);
      if (!g) {
        $("out").classList.remove("show");
        $("err").textContent = raw.trim() ? "That doesn't look like a Gamma link." : "";
        return;
      }
      $("err").textContent = "";
      if (g.title && ($("ttl").value === "" || $("ttl").value === lastAutoTitle)) {
        $("ttl").value = lastAutoTitle = g.title;
      }
      const t = $("ttl").value.trim()
        .replace(/[\/?#\s-]+/g, "-").replace(/^-+|-+$/g, "");
      const link = location.origin + base + g.id + (t ? "/" + encodeURIComponent(t) : "");
      $("link").textContent = link;
      $("open").href = link;
      $("out").classList.add("show");
    }
    $("src").addEventListener("input", update);
    $("ttl").addEventListener("input", update);
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText($("link").textContent); } catch (e) {}
      $("copy").textContent = "Copied";
      setTimeout(() => $("copy").textContent = "Copy link", 1400);
    });
    $("src").focus();
  }
</script>
</body>
</html>
